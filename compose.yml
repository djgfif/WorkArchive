services:
  postgres:
    image: postgres:16-alpine
    container_name: work-archive-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-work_archive}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    ports:
      - '${POSTGRES_PORT:-18732}:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-work_archive}',
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: release
    container_name: work-archive-api-migrate
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: development
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/work_archive?schema=public}
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: work-archive-api
    restart: unless-stopped
    depends_on:
      api-migrate:
        condition: service_completed_successfully
    environment:
      NODE_ENV: development
      DATABASE_URL: ${DATABASE_URL:-postgresql://postgres:postgres@postgres:5432/work_archive?schema=public}
      HOST: ${HOST:-0.0.0.0}
      PORT: 3000
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-true}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:18730}
      WEB_BASE_URL: ${WEB_BASE_URL:-http://localhost:18730}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      READINESS_CHECK_TIMEOUT_MS: ${READINESS_CHECK_TIMEOUT_MS:-1500}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-120000}
      API_HEADERS_TIMEOUT_MS: ${API_HEADERS_TIMEOUT_MS:-15000}
      API_KEEP_ALIVE_TIMEOUT_MS: ${API_KEEP_ALIVE_TIMEOUT_MS:-5000}
      API_JSON_BODY_LIMIT: ${API_JSON_BODY_LIMIT:-2mb}
      API_URLENCODED_BODY_LIMIT: ${API_URLENCODED_BODY_LIMIT:-64kb}
      API_GLOBAL_RATE_LIMIT_MAX: ${API_GLOBAL_RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-120}
      AUTH_SENSITIVE_RATE_LIMIT_MAX: ${AUTH_SENSITIVE_RATE_LIMIT_MAX:-20}
      CATALOG_RATE_LIMIT_MAX: ${CATALOG_RATE_LIMIT_MAX:-20}
      MUTATION_RATE_LIMIT_MAX: ${MUTATION_RATE_LIMIT_MAX:-120}
      SYNC_RATE_LIMIT_MAX: ${SYNC_RATE_LIMIT_MAX:-120}
      PASSWORD_RESET_DEV_LINKS_ENABLED: ${PASSWORD_RESET_DEV_LINKS_ENABLED:-true}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:-local-compose-access-secret-minimum-32-chars}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:-local-compose-refresh-secret-minimum-32-chars}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:-}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:-}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:-http://localhost:18730/api/auth/google/callback}
      EXTERNAL_API_KEY_ENCRYPTION_SECRET: ${EXTERNAL_API_KEY_ENCRYPTION_SECRET:-local-compose-external-api-key-secret-32-chars}
      IMPORT_SERVER_SEARCH_GUEST_ENABLED: ${IMPORT_SERVER_SEARCH_GUEST_ENABLED:-false}
      IMPORT_SERVER_SEARCH_GUEST_APPROVED: ${IMPORT_SERVER_SEARCH_GUEST_APPROVED:-false}
      TMDB_API_READ_TOKEN: ${TMDB_API_READ_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KOBIS_API_KEY: ${KOBIS_API_KEY:-}
      KOBIS_HTTP_PROVIDER_ENABLED: ${KOBIS_HTTP_PROVIDER_ENABLED:-false}
      SEED_DEMO_EMAIL: ${SEED_DEMO_EMAIL:-demo@workarchive.local}
      SEED_DEMO_PASSWORD: ${SEED_DEMO_PASSWORD:-demo-password-123}
    ports:
      - '${API_PORT:-18731}:3000'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/readyz'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: /api
    container_name: work-archive-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - '${WEB_PORT:-18730}:8080'
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/work-archive-config.js',
        ]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
