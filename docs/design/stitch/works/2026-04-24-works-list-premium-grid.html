<!DOCTYPE html>
<html class="dark" lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>작품 목록 - Stitch Reference</title>
  <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Work+Sans:wght@700&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet" />
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            background: '#121315',
            'dark-shell': '#14171b',
            'dark-surface-base': '#1c2128',
            'dark-surface-raised': '#232932',
            'surface-container': '#1e2022',
            'surface-container-high': '#292a2c',
            'surface-container-highest': '#343537',
            'outline': '#8d9198',
            'outline-variant': '#43474d',
            'on-background': '#e3e2e4',
            'on-surface': '#e3e2e4',
            'on-surface-variant': '#c3c6ce',
            primary: '#b6d1f1',
            'primary-container': '#9bb5d4',
            'archive-blue-7': '#3d6390',
            'archive-blue-9': '#253b55',
            'intent-success': '#0f766e',
            tertiary: '#f0c792'
          },
          spacing: {
            'shell-padding': 'clamp(1rem, 2vw, 1.5rem)',
            'container-default': '77.5rem'
          },
          fontFamily: {
            body: ['Inter'],
            h1: ['Work Sans'],
            h2: ['Work Sans']
          }
        }
      }
    };
  </script>
</head>
<body class="bg-background text-on-background font-body min-h-screen antialiased flex">
  <nav class="bg-slate-950 h-full w-64 fixed left-0 top-0 border-r border-slate-800 flex flex-col py-6 px-4 z-20">
    <div class="mb-8 px-4 flex items-center gap-3">
      <div class="w-10 h-10 rounded-full bg-surface-container-highest flex items-center justify-center"><span class="material-symbols-outlined text-primary">person</span></div>
      <div><h2 class="font-h2 text-sm text-slate-100 font-bold">아카이브</h2><p class="text-xs text-on-surface-variant">Media Vault</p></div>
    </div>
    <ul class="flex flex-col gap-1 flex-1 text-sm tracking-tight">
      <li><a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-blue-400 border-r-2 border-blue-400 font-semibold bg-blue-900/10" href="#"><span class="material-symbols-outlined text-lg">library_books</span>서재</a></li>
      <li><a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-900" href="#"><span class="material-symbols-outlined text-lg">folder_special</span>컬렉션</a></li>
      <li><a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-900" href="#"><span class="material-symbols-outlined text-lg">search</span>검색</a></li>
      <li><a class="flex items-center gap-3 px-4 py-2.5 rounded-lg text-slate-400 hover:text-slate-100 hover:bg-slate-900" href="#"><span class="material-symbols-outlined text-lg">settings</span>설정</a></li>
    </ul>
    <button class="w-full flex items-center justify-center gap-2 bg-primary text-slate-950 py-2.5 px-4 rounded-lg text-sm font-semibold"><span class="material-symbols-outlined text-lg">add</span>새 기록 추가</button>
  </nav>

  <div class="flex-1 ml-64 flex flex-col min-h-screen">
    <header class="bg-slate-900/80 backdrop-blur-md fixed top-0 right-0 left-64 h-16 border-b border-slate-800 z-10 flex items-center justify-between px-8 max-w-[77.5rem] mx-auto w-full">
      <nav class="flex gap-6 h-full text-sm">
        <a class="flex items-center text-blue-400 border-b-2 border-blue-400 h-16" href="#">전체</a>
        <a class="flex items-center text-slate-400 hover:text-blue-400 h-16 border-b-2 border-transparent" href="#">최근</a>
        <a class="flex items-center text-slate-400 hover:text-blue-400 h-16 border-b-2 border-transparent" href="#">고정됨</a>
      </nav>
      <div class="flex items-center gap-4">
        <button class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:bg-surface-container"><span class="material-symbols-outlined">filter_list</span></button>
        <button class="w-9 h-9 flex items-center justify-center rounded-lg text-slate-400 hover:bg-surface-container"><span class="material-symbols-outlined">sort</span></button>
        <button class="text-sm font-semibold text-blue-400">라이브러리 동기화</button>
      </div>
    </header>

    <main class="flex-1 mt-16 p-shell-padding max-w-[77.5rem] mx-auto w-full">
      <div class="mb-8 flex flex-col gap-6">
        <div class="flex items-end justify-between">
          <h1 class="font-h1 text-4xl font-bold tracking-tight text-on-surface">작품 목록</h1>
          <div class="flex items-center gap-4">
            <span class="text-sm text-on-surface-variant">248개 기록</span>
            <div class="flex bg-surface-container rounded-lg p-0.5 border border-outline-variant">
              <button aria-label="Grid view" class="p-1.5 rounded-md bg-background text-on-surface"><span class="material-symbols-outlined text-[20px]">grid_view</span></button>
              <button aria-label="List view" class="p-1.5 rounded-md text-on-surface-variant hover:text-on-surface"><span class="material-symbols-outlined text-[20px]">view_list</span></button>
            </div>
          </div>
        </div>

        <div class="flex flex-col sm:flex-row gap-4 justify-between items-start sm:items-center">
          <div class="relative w-full sm:w-96">
            <span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">search</span>
            <input class="w-full bg-dark-surface-raised border border-outline-variant rounded-lg py-2 pl-10 pr-4 text-sm text-on-surface focus:outline-none focus:border-primary-container" placeholder="검색..." type="text" />
          </div>
          <div class="flex flex-wrap gap-2">
            <button class="px-3 py-1.5 rounded-full bg-archive-blue-9 text-primary text-xs font-semibold border border-archive-blue-7">전체</button>
            <button class="px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant text-xs font-semibold border border-outline-variant hover:bg-surface-container-high">영화</button>
            <button class="px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant text-xs font-semibold border border-outline-variant hover:bg-surface-container-high">도서</button>
            <button class="px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant text-xs font-semibold border border-outline-variant hover:bg-surface-container-high">게임</button>
            <button class="px-3 py-1.5 rounded-full bg-surface-container text-on-surface-variant text-xs font-semibold border border-outline-variant hover:bg-surface-container-high">TV 프로그램</button>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 xl:grid-cols-5 gap-6">
        <div class="flex flex-col group cursor-pointer">
          <div class="relative aspect-[3/4] w-full rounded border border-outline-variant overflow-hidden mb-3 bg-surface-container">
            <img alt="Blade Runner 2049" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="https://images.unsplash.com/photo-1536440136628-849c177e76a1?auto=format&fit=crop&w=600&q=80" />
            <div class="absolute top-2 right-2 bg-background/90 border border-outline-variant px-2 py-0.5 rounded text-[0.65rem] font-bold tracking-wider text-intent-success uppercase">완료</div>
          </div>
          <h3 class="text-sm font-semibold text-on-surface truncate group-hover:text-primary-container">Blade Runner 2049</h3>
          <div class="flex items-center gap-2 mt-1 text-xs text-on-surface-variant"><span>영화</span><span class="w-1 h-1 rounded-full bg-outline-variant"></span><span>2017</span></div>
        </div>

        <div class="flex flex-col group cursor-pointer">
          <div class="relative aspect-[3/4] w-full rounded border border-outline-variant overflow-hidden mb-3 bg-surface-container">
            <img alt="The Dispossessed" class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="https://images.unsplash.com/photo-1544947950-fa07a98d237f?auto=format&fit=crop&w=600&q=80" />
            <div class="absolute top-2 right-2 bg-background/90 border border-outline-variant px-2 py-0.5 rounded text-[0.65rem] font-bold tracking-wider text-primary uppercase">기록 중</div>
          </div>
          <h3 class="text-sm font-semibold text-on-surface truncate group-hover:text-primary-container">The Dispossessed</h3>
          <div class="flex items-center gap-2 mt-1 text-xs text-on-surface-variant"><span>도서</span><span class="w-1 h-1 rounded-full bg-outline-variant"></span><span>1974</span></div>
        </div>

        <div class="flex flex-col group cursor-pointer">
          <div class="relative aspect-[3/4] w-full rounded border border-outline-variant overflow-hidden mb-3 bg-surface-container flex items-center justify-center">
            <div class="w-full h-full bg-dark-surface-raised flex flex-col items-center justify-center p-4 text-center">
              <span class="text-4xl font-bold text-surface-container-highest mb-2">D</span>
              <span class="text-xs text-outline uppercase tracking-widest">게임</span>
            </div>
            <div class="absolute top-2 right-2 bg-background/90 border border-outline-variant px-2 py-0.5 rounded text-[0.65rem] font-bold tracking-wider text-tertiary uppercase">기록 예정</div>
          </div>
          <h3 class="text-sm font-semibold text-on-surface truncate group-hover:text-primary-container">Disco Elysium</h3>
          <div class="flex items-center gap-2 mt-1 text-xs text-on-surface-variant"><span>게임</span><span class="w-1 h-1 rounded-full bg-outline-variant"></span><span>2019</span></div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
