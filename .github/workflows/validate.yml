name: validate

on:
  pull_request:
  push:
    branches:
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Public repository guardrails
        run: npm run security:public

      - name: Documentation links
        run: npm run check:docs-links

      - name: Web import cycles
        run: npm run check:web-import-cycles

      - name: Web feature boundaries
        run: npm run check:web-boundaries

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: env TMPDIR=/tmp npm run test

      - name: API E2E
        run: npm run test:e2e

      - name: Build
        run: npm run build

      - name: Production compose config
        env:
          CORS_ORIGIN: https://archive.example.com
          DATABASE_URL: postgresql://work_archive:example-password@postgres:5432/work_archive?schema=public
          EXTERNAL_API_KEY_ENCRYPTION_SECRET: ci-external-api-key-encryption-secret-minimum-32
          GOOGLE_OAUTH_CLIENT_ID: ci-google-client-id
          GOOGLE_OAUTH_CLIENT_SECRET: ci-google-client-secret
          GOOGLE_OAUTH_REDIRECT_URI: https://archive.example.com/api/auth/google/callback
          JWT_ACCESS_SECRET: ci-access-secret-minimum-32-characters
          JWT_REFRESH_SECRET: ci-refresh-secret-minimum-32-characters
          POSTGRES_DB: work_archive
          POSTGRES_PASSWORD: example-password
          POSTGRES_USER: work_archive
          SECURITY_EVENT_HASH_SECRET: ci-security-event-hash-secret-minimum-32
          WEB_BASE_URL: https://archive.example.com
        run: docker compose -f compose.prod.yml config >/dev/null

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: work_archive_integration
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d work_archive_integration"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CORS_ORIGIN: http://localhost:8080
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/work_archive_integration?schema=public
      EXTERNAL_API_KEY_ENCRYPTION_SECRET: integration-external-api-key-secret-minimum-32-chars
      JWT_ACCESS_SECRET: integration-access-secret-minimum-32-chars
      JWT_REFRESH_SECRET: integration-refresh-secret-minimum-32-chars
      NODE_ENV: test
      PASSWORD_RESET_DEV_LINKS_ENABLED: 'false'
      SWAGGER_ENABLED: 'false'
      WEB_BASE_URL: http://localhost:8080

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Deploy migrations
        run: npm run prisma:migrate:deploy --workspace @work-archive/api

      - name: Integration test
        run: npm run test:integration --workspace @work-archive/api
