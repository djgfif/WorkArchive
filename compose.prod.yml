services:
  postgres:
    image: postgres:16-alpine
    container_name: work-archive-postgres
    cpus: '1.00'
    mem_limit: 1g
    pids_limit: 256
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?required}
      POSTGRES_USER: ${POSTGRES_USER:?required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?required}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  redis:
    image: redis:7-alpine
    container_name: work-archive-redis
    cpus: '0.50'
    mem_limit: 256m
    pids_limit: 128
    restart: unless-stopped
    command: ['redis-server', '--appendonly', 'yes']
    volumes:
      - redis-data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: work-archive-api
    cpus: '1.00'
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DATABASE_URL: ${DATABASE_URL:?required}
      HOST: ${HOST:-0.0.0.0}
      PORT: 3000
      SWAGGER_ENABLED: 'false'
      CORS_ORIGIN: ${CORS_ORIGIN:?required}
      WEB_BASE_URL: ${WEB_BASE_URL:?required}
      PASSWORD_RESET_DEV_LINKS_ENABLED: 'false'
      RATE_LIMIT_STORE: ${RATE_LIMIT_STORE:-redis}
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
      TRUST_PROXY_HOPS: ${TRUST_PROXY_HOPS:-1}
      RATE_LIMIT_PREFIX: ${RATE_LIMIT_PREFIX:-work-archive:rate-limit:}
      API_GLOBAL_RATE_LIMIT_MAX: ${API_GLOBAL_RATE_LIMIT_MAX:-600}
      AUTH_RATE_LIMIT_MAX: ${AUTH_RATE_LIMIT_MAX:-120}
      AUTH_SENSITIVE_RATE_LIMIT_MAX: ${AUTH_SENSITIVE_RATE_LIMIT_MAX:-20}
      CATALOG_RATE_LIMIT_MAX: ${CATALOG_RATE_LIMIT_MAX:-20}
      IMPORT_AUTH_RATE_LIMIT_MAX: ${IMPORT_AUTH_RATE_LIMIT_MAX:-60}
      IMPORT_GUEST_RATE_LIMIT_MAX: ${IMPORT_GUEST_RATE_LIMIT_MAX:-20}
      IMAGE_PROXY_RATE_LIMIT_MAX: ${IMAGE_PROXY_RATE_LIMIT_MAX:-120}
      MUTATION_RATE_LIMIT_MAX: ${MUTATION_RATE_LIMIT_MAX:-120}
      NOTION_RATE_LIMIT_MAX: ${NOTION_RATE_LIMIT_MAX:-20}
      RATE_LIMIT_WINDOW_MS: ${RATE_LIMIT_WINDOW_MS:-60000}
      SYNC_RATE_LIMIT_MAX: ${SYNC_RATE_LIMIT_MAX:-120}
      READINESS_CHECK_TIMEOUT_MS: ${READINESS_CHECK_TIMEOUT_MS:-1500}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-120000}
      API_HEADERS_TIMEOUT_MS: ${API_HEADERS_TIMEOUT_MS:-15000}
      API_KEEP_ALIVE_TIMEOUT_MS: ${API_KEEP_ALIVE_TIMEOUT_MS:-5000}
      API_JSON_BODY_LIMIT: ${API_JSON_BODY_LIMIT:-2mb}
      API_URLENCODED_BODY_LIMIT: ${API_URLENCODED_BODY_LIMIT:-64kb}
      COOKIE_SECURE: 'true'
      METRICS_ENABLED: ${METRICS_ENABLED:-false}
      METRICS_INTERNAL_ACCESS_REVIEWED: ${METRICS_INTERNAL_ACCESS_REVIEWED:-false}
      METRICS_BEARER_TOKEN: ${METRICS_BEARER_TOKEN:-}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?required}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET:?required}
      GOOGLE_OAUTH_CLIENT_ID: ${GOOGLE_OAUTH_CLIENT_ID:?required}
      GOOGLE_OAUTH_CLIENT_SECRET: ${GOOGLE_OAUTH_CLIENT_SECRET:?required}
      GOOGLE_OAUTH_REDIRECT_URI: ${GOOGLE_OAUTH_REDIRECT_URI:?required}
      SECURITY_EVENT_HASH_SECRET: ${SECURITY_EVENT_HASH_SECRET:?required}
      EXTERNAL_API_KEY_ENCRYPTION_SECRET: ${EXTERNAL_API_KEY_ENCRYPTION_SECRET:?required}
      IMPORT_SERVER_SEARCH_GUEST_ENABLED: ${IMPORT_SERVER_SEARCH_GUEST_ENABLED:-false}
      IMPORT_SERVER_SEARCH_GUEST_APPROVED: ${IMPORT_SERVER_SEARCH_GUEST_APPROVED:-false}
      TMDB_API_READ_TOKEN: ${TMDB_API_READ_TOKEN:-}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      NAVER_CLIENT_ID: ${NAVER_CLIENT_ID:-}
      NAVER_CLIENT_SECRET: ${NAVER_CLIENT_SECRET:-}
      KAKAO_REST_API_KEY: ${KAKAO_REST_API_KEY:-}
      KOBIS_API_KEY: ${KOBIS_API_KEY:-}
      KOBIS_HTTP_PROVIDER_ENABLED: ${KOBIS_HTTP_PROVIDER_ENABLED:-false}
      WORK_ARCHIVE_CLIENT_HEADER_GUARD: ${WORK_ARCHIVE_CLIENT_HEADER_GUARD:-audit}
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'node -e "fetch(''http://127.0.0.1:3000/readyz'').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 45s

  api-migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: release
    container_name: work-archive-api-migrate
    cpus: '1.00'
    mem_limit: 512m
    pids_limit: 256
    read_only: true
    profiles: ['release']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NODE_ENV: production
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  retention-cleanup:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: work-archive-retention-cleanup
    cpus: '0.50'
    mem_limit: 256m
    pids_limit: 128
    entrypoint:
      ['node', '/workspace/apps/api/dist/operations/retention-cleanup.js']
    profiles: ['maintenance']
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:?required}
      NODE_ENV: production
      RETENTION_CLEANUP_DRY_RUN: ${RETENTION_CLEANUP_DRY_RUN:-true}
      RETENTION_CLEANUP_CONFIRM: ${RETENTION_CLEANUP_CONFIRM:-}
      RETENTION_EXPIRED_PASSWORD_RESET_TOKEN_DAYS: ${RETENTION_EXPIRED_PASSWORD_RESET_TOKEN_DAYS:-7}
      RETENTION_EXPIRED_REFRESH_SESSION_DAYS: ${RETENTION_EXPIRED_REFRESH_SESSION_DAYS:-30}
      RETENTION_REVOKED_REFRESH_SESSION_DAYS: ${RETENTION_REVOKED_REFRESH_SESSION_DAYS:-30}
      RETENTION_SECURITY_EVENT_DAYS: ${RETENTION_SECURITY_EVENT_DAYS:-180}
      RETENTION_USED_PASSWORD_RESET_TOKEN_DAYS: ${RETENTION_USED_PASSWORD_RESET_TOKEN_DAYS:-7}
    read_only: true
    restart: 'no'
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/api}
    container_name: work-archive-web
    cpus: '0.50'
    mem_limit: 128m
    pids_limit: 128
    read_only: true
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /var/cache/nginx:size=64m,mode=1777
      - /var/run:size=8m,mode=1777
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD-SHELL',
          'wget -q -O /dev/null http://127.0.0.1:8080/work-archive-config.js',
        ]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    ports:
      - '${WEB_PORT:-8080}:8080'

volumes:
  postgres-data:
  redis-data:
